# Lint config for CI. ruff is a CI-only tool: it is deliberately not a project
# dev dependency, so `pytest`/`pytest-cov` remain the only things contributors install.
line-length = 120
indent-width = 4
target-version = "py310"

[lint]
select = ["E", "F", "I", "N", "W"]

[lint.isort]
# tests/conftest.py puts hooks/, statusline/ and scripts/ on sys.path, so these are
# imported by bare name. Without this they would be sorted as third-party.
known-first-party = [
    "cli",
    "complexity_router",
    "cost_statusline",
    "generate_agent",
    "manage_claude_md",
    "merge_settings",
    "update_pricing",
]
